# Render Blueprint — provisions the backend web service + persistent PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage: Render Dashboard → New + → Blueprint → point at this repo.
# Render reads this file, creates the Postgres DB, and wires the DB_* env vars
# into the backend automatically. See docs/render-postgres-setup.md for details.

databases:
  - name: school-saas-db
    databaseName: school_saas_db
    plan: free
    # region must match the web service region below for the free internal network
    region: oregon

services:
  - type: web
    name: school-website-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: school-website-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Database connection — pulled from the managed Postgres instance above.
      - key: DB_HOST
        fromDatabase:
          name: school-saas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: school-saas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: school-saas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: school-saas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: school-saas-db
          property: password

      # Mail credentials are secrets — set these in the Render dashboard, not here.
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

      # JWT signing secret — REQUIRED in prod (JwtService fails fast if blank).
      # Render generates a strong random value on first deploy.
      - key: JWT_SECRET
        generateValue: true

      # CORS allowlist — comma-separated. Set in the Render dashboard to your Vercel
      # app URL plus every tenant custom domain, e.g.:
      #   https://<your-app>.vercel.app,https://www.pioneerschools.co.in,https://pioneerschools.co.in
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Sender identity for OTP / recovery emails.
      - key: MAIL_FROM
        sync: false
