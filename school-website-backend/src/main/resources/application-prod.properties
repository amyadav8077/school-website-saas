# Production/Docker Configurations: PostgreSQL Connection with local fallback
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:school_saas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# One-time full reseed of the 'pioneer' tenant. Set env SEED_FORCE_REFRESH=true to
# wipe & re-seed on next boot, then set back to false. Default false = never wipe.
seed.force-refresh=${SEED_FORCE_REFRESH:false}
# PostgreSQL Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Connection pool sizing (override per environment via env vars).
# Kept comfortably under Neon's connection ceiling while allowing real concurrency.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Web server threads for concurrent public traffic.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# Redis Docker Settings with local fallback
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Production logging levels (override with LOG_LEVEL_* env vars if deeper diagnostics are needed)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:WARN}
logging.level.org.hibernate.SQL=WARN

# Spring Mail Configuration (Gmail SMTP) — credentials from env vars in production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT authentication — JWT_SECRET is REQUIRED in production (strong 32+ char random value).
# JwtService fails fast on startup if this is blank under the prod profile.
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:720}

# CORS allowlist — set CORS_ALLOWED_ORIGINS to your Vercel app + each tenant custom domain
# (comma-separated; wildcard patterns like https://*.vercel.app are allowed).
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

# Request/upload size limits (DoS protection for the inline Base64 media path).
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:4MB}
server.tomcat.max-http-form-post-size=${MAX_REQUEST_SIZE:4MB}
server.tomcat.max-swallow-size=${MAX_REQUEST_SIZE:4MB}

# Mail sender identity (env-configurable; no personal address hardcoded).
app.mail.from=${MAIL_FROM:no-reply@schoolsaas.local}
