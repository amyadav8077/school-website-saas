# Default Configurations: File-Based H2 Database (persists across restarts for local development)
spring.datasource.url=jdbc:h2:file:./data/school_saas_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2 Hibernate Dialect Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Spring Mail Configuration (Gmail SMTP) — credentials from env vars, never hardcoded
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Redis Default (localhost)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Flyway Settings
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
# Request/upload size limits (DoS protection). Media is stored inline (Base64),
# so cap the whole request too, not just multipart parts.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:4MB}
server.tomcat.max-http-form-post-size=${MAX_REQUEST_SIZE:4MB}
server.tomcat.max-swallow-size=${MAX_REQUEST_SIZE:4MB}
# JWT auth (dev secret; production MUST override JWT_SECRET with a strong 32+ char value)
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:720}
# CORS allowlist (dev)
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Mail sender identity (env-configurable; no personal address hardcoded)
app.mail.from=${MAIL_FROM:no-reply@schoolsaas.local}
# Logging (local dev — INFO to avoid leaking security filter internals)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
