# Default Configurations: File-Based H2 Database (persists across restarts for local development)
spring.datasource.url=jdbc:h2:file:./data/school_saas_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Hibernate Dialect Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Spring Mail Configuration (Gmail SMTP) — credentials from env vars, never hardcoded
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Redis Default (localhost)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Flyway Settings
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true

# Debug Logging for Spring Security & Web MVC
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
